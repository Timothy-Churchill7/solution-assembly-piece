# Static, and genuinely static: no build step, no bundler, no framework.
# The whole build is the files in this folder, which is the constraint the
# piece was written under and the reason it deploys by being copied.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
